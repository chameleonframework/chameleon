# GitHub Actions workflow to build a Gradle project.
name: "Gradle"
on:
  push:
    branches: [ "main" ]
    tags-ignore: ["**"]
  pull_request:
    branches: [ "main" ]
  merge_group:

concurrency: "gradle-build-${{ github.event.number || github.ref }}"

jobs:
  build:
    name: "Build"
    uses: HyperaDev/actions/.github/workflows/gradle-build.yml@beddc3665d0e5acb585777857b14115017633dd0 # main
    with:
      java_version: "21"
      gradle_warning_mode: "fail"
      codecov_enabled: true
    secrets:
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
